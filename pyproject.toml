[project]
name = "pku-mcp"
version = "0.3.0"
description = "让 AI Agent 读北大教学网、课表和成绩的本地 MCP 服务：自动登录、自动手机令牌、学期资料整理"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "cryptography>=42",
    "httpx>=0.27,<1",
    "mcp>=1.12,<2",
    "pillow>=10",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
    "zxing-cpp>=2.2,<4",
]

[project.scripts]
pku-mcp = "pku_mcp.cli:run"

[project.urls]
Homepage = "https://github.com/a1henu/pku-mcp"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
